name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    # mdit-desktop (GPUI) targets macOS and is covered by Desktop Checks.
    steps:
    - uses: actions/checkout@v4
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
    - uses: dtolnay/rust-toolchain@stable
    - uses: swatinem/rust-cache@v2
    - name: Build
      run: cargo build --workspace --exclude mdit-desktop --locked --verbose
    - name: Run tests
      run: cargo test --workspace --exclude mdit --exclude mdit-desktop --locked --verbose
